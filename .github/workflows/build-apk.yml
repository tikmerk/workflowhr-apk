name: Android Auto Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./android  # এখানে 'android' এর জায়গায় আপনার ফোল্ডারের নাম দিন (যদি আলাদা হয়)

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: ./android  # এখানেও ফোল্ডারের নাম দিন

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: workflow-hr-app
        path: android/app/build/outputs/apk/debug/app-debug.apk # এখানে শুরুতে 'android/' যুক্ত করা হয়েছে
