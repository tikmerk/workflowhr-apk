name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment (Capacitor CLI requires Node >= 22)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Install all frontend dependencies
      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      # Step 4: Build web app dist bundle
      - name: Build Web Application
        run: npm run build

      # Step 5: Sync Capacitor with Android assets
      - name: Sync Web Assets to Android
        run: npx cap sync android

      # Step 6: Set up Java JDK 21 (required by Capacitor 7)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 7: Grant execute permission for gradlew
      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew

      # Step 8: Build Android APK using Gradle
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Ensure direct file is named WorkflowHR.apk
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} app/build/outputs/apk/debug/WorkflowHR.apk \;

      # Step 9: Upload APK as downloadable GitHub Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkflowHR-APK
          path: android/app/build/outputs/apk/debug/WorkflowHR.apk
          retention-days: 30

      # Step 10: Create Direct GitHub Release (1-click download without ZIP)
      - name: Create Direct APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: Workflow HR Android App
          body: |
            ### 📱 Workflow HR Android Mobile App
            সরাসরি ডাউনলোড করে ফোনে ইনস্টল করার জন্য নিচের **WorkflowHR.apk** ফাইলের লিঙ্কে ক্লিক করুন। কোনো জিপ (ZIP) আনপ্যাক করতে হবে না।
          files: android/app/build/outputs/apk/debug/WorkflowHR.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
